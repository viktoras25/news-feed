name: daily-news

on:
  schedule:
    # Every day at 05:15 UTC (06:15 or 07:15 Berlin time, depending on daylight saving time).
    - cron: '00 3 * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Window in hours (empty: since the last successful run, 24-72 h)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Fails only if more than half of the feeds are dead or the files cannot be written.
      # In that case nothing is committed and out/ and state/ stay as they were.
      - name: Build the digest
        env:
          WINDOW_HOURS: ${{ inputs.window_hours }}
        run: npm run build-news

      - name: Commit out/ and state/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out state
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: $(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Show health summary
        if: always()
        run: |
          if [ -f out/latest/health.md ]; then head -30 out/latest/health.md >> "$GITHUB_STEP_SUMMARY"; fi
