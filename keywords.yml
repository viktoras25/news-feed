# Mechanical markers only. The script does not judge importance or topic: that is left to the reader (an LLM).

# Ads: matched from the start of a word, case-insensitive, in the title or snippet.
excludeWords:
  - Gewinnspiel

# Ads, announcements and recurring roundups: title prefixes, case-insensitive.
excludeTitlePrefixes:
  - Anzeige
  - heise-Angebot
  - heise+
  - Pressemitteilung
  - Aktuelle Pressemitteilungen
  - Entdecken Sie
  - Livestream
  # daily roundups (a list of stories under one title)
  - "Montag:"
  - "Dienstag:"
  - "Mittwoch:"
  - "Donnerstag:"
  - "Freitag:"
  - "Samstag:"
  - "Sonntag:"

# Not articles: video and audio pages, press portals, studio promotion.
excludeUrlParts:
  - /video/
  - /videos/
  - /video-
  - /multimedia/
  - /podcast
  - presseportal.zdf.de
  - 3d.zdf.de
