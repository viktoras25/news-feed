# include: case-insensitive substring, except words from wordBoundary (whole word, case-sensitive).
# exclude: match from the start of a word, case-insensitive.

# priority 2: an entry passes only if at least one of these words is in the title or description.
include:
  - Steuer
  - Rente
  - Freiberufler
  - Selbstständig
  - Sozialversicherung
  - Bürgergeld
  - Mindestlohn
  - Entlassung
  - Stellenabbau
  - Arbeitsmarkt
  - Künstliche Intelligenz
  - Leipzig
  - Sachsen
  - Ukraine
  - EZB
  - Inflation
  - Zinsen
  - Bundesbank
  - Wohnen
  - Miete

# Short words that must be matched as whole words only (otherwise "KI" would be found inside "Kinder").
wordBoundary:
  - KI
  - EZB
  - AI

# Noise: the entry is dropped for any priority.
exclude:
  - Bundesliga
  - Champions League
  - Fußball
  - Formel 1
  - Tennis
  - Handball
  - Olympia
  - Promi
  - Klatsch
  - Royals
  - Horoskop
  - Autotest
  - Fahrbericht
  - Probefahrt
  - Polizeimeldung
  - Festnahme
  - Messerangriff
  - Tatverdächtig
  - Leiche
